<div class="ticket-container" *ngIf="!loading() && ticket()">
  <div class="header-row">
    <h2>Ticket Details</h2>
    <div class="badges">
      <span class="badge status" [ngClass]="ticket()?.status">
        {{ ticket()?.status }}
      </span>
      <span class="badge priority" [ngClass]="ticket()?.priority">
        {{ ticket()?.priority }}
      </span>
    </div>
  </div>

  <div class="card">
    <!-- Editable Title -->
    <label class="label">Title</label>
    <input
      class="input"
      [(ngModel)]="ticket()!.title"
      (ngModelChange)="updateField('title', $event)"
    />

    <!-- Editable Description -->
    <label class="label">Description</label>
    <textarea
      class="textarea"
      rows="4"
      [(ngModel)]="ticket()!.description"
      (ngModelChange)="updateField('description', $event)"
    ></textarea>

    <div class="row">
      <!-- Status Dropdown -->
      <div class="col">
        <label class="label">Status</label>
        <select class="select" [(ngModel)]="ticket()!.status">
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="closed">Closed</option>
        </select>
      </div>

      <!-- Priority Dropdown -->
      <div class="col">
        <label class="label">Priority</label>
        <select class="select" [(ngModel)]="ticket()!.priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>

    <div class="meta">
      <div>Created: {{ ticket()?.created_at | date: 'dd.MM.yyyy HH:mm' }}</div>
      <div>Updated: {{ ticket()?.updated_at | date: 'dd.MM.yyyy HH:mm' }}</div>
      <div>ID: {{ ticket()?.id }}</div>
    </div>

    <div class="actions">
      <button class="btn save" (click)="saveChanges()" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Changes' }}
      </button>

      <button class="btn delete" (click)="confirmDelete()">Delete Ticket</button>
    </div>

    <!-- Delete confirmation modal -->
    <div class="confirm-backdrop" *ngIf="showConfirmDelete()"></div>

    <div class="confirm-box" *ngIf="showConfirmDelete()">
      <p>Are you sure you want to delete this ticket?</p>

      <div class="confirm-actions">
        <button class="btn delete" (click)="deleteTicket()">Yes, delete</button>
        <button class="btn" (click)="showConfirmDelete.set(false)">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Loading & Error States -->
<div *ngIf="loading()" class="loading">Loading ticket...</div>
<div *ngIf="error()" class="error">{{ error() }}</div>
