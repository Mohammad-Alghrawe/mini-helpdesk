<div class="page">
  <!-- HEADER + STATS + ACTIONS -->
  <div class="dashboard-header">
    <h2>Tickets</h2>

    <!-- STATS BLOCK -->
    <div class="stats">
      <div class="stat open">
        <span class="count">{{ stats.open }}</span>
        <span class="label">Open</span>
      </div>

      <div class="stat progress">
        <span class="count">{{ stats.in_progress }}</span>
        <span class="label">In Progress</span>
      </div>

      <div class="stat closed">
        <span class="count">{{ stats.closed }}</span>
        <span class="label">Closed</span>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button routerLink="/tickets/new" class="btn primary">+ New Ticket</button>
      <button (click)="load()" class="btn">Refresh</button>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <input
      type="text"
      placeholder="Search tickets..."
      [(ngModel)]="searchText"
      (input)="applyFilters()"
      class="search-input"
    />

    <select [(ngModel)]="statusFilter" (change)="applyFilters()" class="select-filter">
      <option value="all">All Statuses</option>
      <option value="open">Open</option>
      <option value="in_progress">In Progress</option>
      <option value="closed">Closed</option>
    </select>
    <!-- ⭐ SORTING DROPDOWN -->
    <select [(ngModel)]="sortOption" (change)="applyFilters()" class="select-filter">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="priority">Priority High → Low</option>
    </select>
  </div>

  <!-- ERROR MESSAGE -->
  <div *ngIf="errorMsg" class="error hint">{{ errorMsg }}</div>

  <!-- TICKET LIST -->
  <ng-container *ngIf="!loading; else loadingTpl">
    <div class="list">
      <div class="ticket-card" *ngFor="let t of filteredTickets" [routerLink]="['/tickets', t.id]">
        <h3>{{ t.title }}</h3>
        <p>{{ t.description }}</p>

        <div class="meta">
          <span>ID: {{ t.id }}</span>
          <span>•</span>
          <span>Created: {{ t.created_at }}</span>
        </div>

        <div class="badges">
          <span class="badge status" [ngClass]="t.status">{{ t.status }}</span>
          <span class="badge priority" [ngClass]="t.priority">{{ t.priority }}</span>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #loadingTpl>
    <div class="loading">Loading tickets...</div>
  </ng-template>
</div>
<!-- END .page -->
